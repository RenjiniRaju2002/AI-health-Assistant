<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Health Assistant Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="left-sidebar glass-card">
        <div class="brand">
          <div class="brand-icon" aria-hidden="true">
            <svg
              class="brand-icon-svg"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              role="img"
            >
              <title>Health pulse logo</title>
              <defs>
                <linearGradient id="brandPulseBand" x1="0%" y1="50%" x2="100%" y2="50%">
                  <stop offset="0%" stop-color="rgba(0, 55, 62, 0)" />
                  <stop offset="38%" stop-color="rgba(0, 72, 82, 0.55)" />
                  <stop offset="62%" stop-color="rgba(0, 72, 82, 0.55)" />
                  <stop offset="100%" stop-color="rgba(0, 55, 62, 0)" />
                </linearGradient>
              </defs>
              <!-- Darker horizontal band behind the pulse (depth / glass effect) -->
              <rect x="1.5" y="10.75" width="21" height="4.5" rx="1.25" fill="url(#brandPulseBand)" />
              <!-- ECG / heartbeat line (white, centered) -->
              <polyline
                points="4,12.5 8.25,12.5 9.75,9.25 11.25,16.25 12,7.75 12.75,16.25 14.25,9.25 15.75,12.5 20,12.5"
                stroke="#ffffff"
                stroke-width="1.35"
                stroke-linecap="round"
                stroke-linejoin="round"
                fill="none"
              />
              <!-- Heart outline (white, rounded stroke) -->
              <path
                d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"
                fill="none"
                stroke="#ffffff"
                stroke-width="1.65"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </div>
          <div>
            <h1>Health AI</h1>
            <p>Assistant</p>
          </div>
        </div>

        <nav class="nav-menu" id="sideNav" aria-label="Main navigation">
          <button type="button" class="nav-item active" data-nav="chat">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
            Chat
          </button>
          <button type="button" class="nav-item" data-nav="home">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            Home
          </button>
          <button type="button" class="nav-item" data-nav="history">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
            History
          </button>
          <button type="button" class="nav-item" data-nav="reminders">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
            Reminders
          </button>
          <button type="button" class="nav-item" data-nav="nearby">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
            Nearby Help
          </button>
          <button type="button" class="nav-item" data-nav="settings">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            Settings
          </button>
        </nav>

        <div class="theme-switch">
          <span>Dark Mode</span>
          <label class="switch">
            <input id="themeToggle" type="checkbox" />
            <span class="slider"></span>
          </label>
        </div>


      </aside>

      <main class="chat-column" id="chatColumn">
        <header class="chat-header glass-card">
          <div>
            <h2>AI Health Assistant <span class="verified">✔</span></h2>
            <p class="tagline">Your daily wellness companion</p>
            <p class="online"><span></span>Online</p>
          </div>
          <div class="header-actions">
            <select id="languageSelect" title="Auto uses the language you type; or choose a fixed reply language">
              <option value="auto" selected>Auto (detect)</option>
              <option value="en">English</option>
              <option value="ml">Malayalam</option>
              <option value="hi">Hindi</option>
            </select>
            <button type="button" class="icon-btn" id="ttsBtn" title="Toggle read-aloud for bot replies" aria-pressed="false">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
            </button>
          </div>
        </header>

        <section class="chat-window" id="chatWindow" aria-live="polite">
          <div id="chatStream" class="chat-stream"></div>
          <div id="typingIndicator" class="typing hidden" aria-hidden="true">
            Bot is typing<span>.</span><span>.</span><span>.</span>
          </div>
        </section>

        <footer class="chat-input glass-card">
          <div class="input-row">
            <div class="voice-holder">
              <button class="mic pulse" id="micButton">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
              </button>
              <small>Hold ~0.3s, then release</small>
            </div>
            <input type="text" id="messageInput" placeholder="Type your message..." autocomplete="off" />
            <button type="button" class="emoji" id="emojiBtn" title="Insert emoji">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M8 14s1.5 2 4 2 4-2 4-2"></path><line x1="9" y1="9" x2="9.01" y2="9"></line><line x1="15" y1="9" x2="15.01" y2="9"></line></svg>
            </button>
            <button type="button" class="send" id="sendBtn" title="Send">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
          </div>
          <p id="recordingState" class="recording hidden">Recording in progress...</p>
          <div class="chips" id="quickChips">
            <button type="button" class="chip" data-query="I have fever">Fever</button>
            <button type="button" class="chip" data-query="I have cold">Cold</button>
            <button type="button" class="chip" data-query="I have headache">Headache</button>
            <button type="button" class="chip" data-query="I have stomach pain">Stomach Pain</button>
            <button type="button" class="chip" data-query="I have cough">Cough</button>
            <button type="button" class="chip" data-query="More symptoms: body pain and tiredness">More</button>
          </div>
      </main>

      <aside class="right-sidebar">
        <section class="side-panel glass-card">
          <h3>
            <div class="heading-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
            </div>
            Quick Suggestions
          </h3>
          <ul id="quickSuggestList">
            <li role="button" tabindex="0" data-query="I have fever"><span class="emoji-icon">🌡</span> Fever <svg class="arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg></li>
            <li role="button" tabindex="0" data-query="I have cold and runny nose"><span class="emoji-icon">❄</span> Cold <svg class="arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg></li>
            <li role="button" tabindex="0" data-query="I have headache"><span class="emoji-icon">🧠</span> Headache <svg class="arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg></li>
            <li role="button" tabindex="0" data-query="I have stomach pain"><span class="emoji-icon">🫃</span> Stomach Pain <svg class="arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg></li>
            <li role="button" tabindex="0" data-query="I have cough"><span class="emoji-icon">🫁</span> Cough <svg class="arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg></li>
          </ul>
        </section>

        <section class="side-panel glass-card" id="historyPanel">
          <h3>
            <div class="heading-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
            </div>
            Chat History <a href="#" id="historyViewAll" class="view-all-link">View All</a>
          </h3>
          <ul class="history" id="historyList"></ul>
        </section>

        <button type="button" class="nearby-help" id="nearbyHelpCard" aria-label="Find nearby hospitals on Google Maps">
          <div class="help-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
          </div>
          <div class="nearby-help-text">
            <h3>Nearby Help</h3>
            <p>Find nearby doctors and clinics</p>
          </div>
          <span class="nearby-help-arrow" aria-hidden="true">›</span>
        </button>
      </aside>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="./script.js"></script>
  </body>
</html>
